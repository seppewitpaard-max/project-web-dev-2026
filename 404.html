<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Pagina niet gevonden</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .fout-zone {
            text-align: center;
            padding: 60px 20px;
        }

        .fout-zone h2 {
            font-size: 8rem;
            color: #cc0000;
            margin: 0;
        }

        .fout-zone h3 {
            font-size: 2rem;
            color: #3b4cca;
            margin: 10px 0;
        }

        .fout-zone p {
            font-size: 1.2rem;
            margin: 20px 0;
        }

        .pokeball {
            width: 150px;
            height: 150px;
            background: linear-gradient(to bottom, #cc0000 50%, white 50%);
            border-radius: 50%;
            border: 5px solid #222;
            margin: 30px auto;
            position: relative;
            animation: draaien 2s linear infinite;
        }

        .pokeball-midden {
            width: 30px;
            height: 30px;
            background-color: white;
            border-radius: 50%;
            border: 5px solid #222;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pokeball-lijn {
            width: 100%;
            height: 5px;
            background-color: #222;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes draaien {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fout-zone a button {
            font-size: 1.2rem;
            padding: 15px 30px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Header met logo en titel -->
    <header>
        <img src="media/logo.png" alt="Pokémon Logo">
        <h1>Pokémon Type Quiz</h1>
    </header>

    <!-- Navigatie -->
    <nav>
        <a href="index.html">Home</a>
        <a href="html/game.html">Spel</a>
    </nav>

    <!-- Foutboodschap -->
    <main>
        <div class="fout-zone">
            <h2>404</h2>
            <h3>Oeps! Pagina niet gevonden!</h3>

            <!-- Animerende Pokéball -->
            <div class="pokeball">
                <div class="pokeball-lijn"></div>
                <div class="pokeball-midden"></div>
            </div>

            <p>Het lijkt erop dat deze pagina gevangen is door Team Rocket...</p>
            <p>Misschien heb je een foute URL ingegeven?</p>
            <a href="index.html"><button>Terug naar home</button></a>
        </div>
    </main>

    <!-- Footer met schooladres -->
    <footer>
        <table>
            <tr>
                <th>School</th>
                <th>Adres</th>
                <th>Stad</th>
            </tr>
            <tr>
                <td>Campus Het Spoor</td>
                <td>Schoolstraat 1</td>
                <td>9000 Gent</td>
            </tr>
        </table>
    </footer>

</body>
</html>
