            margin: 20px 0;
        }
        .bal {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 35% 35%, #fff 0%, #ddd 60%, #aaa 100%);
            border-radius: 50%;
            border: 3px solid #222;
            margin: 30px auto;
            animation: stuiteren 1s ease-in-out infinite alternate;
        }
        @keyframes stuiteren {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-40px); }
        }
        .fout-zone a button {
            font-size: 1.2rem;
