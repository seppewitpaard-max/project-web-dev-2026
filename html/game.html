<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Milan Quiz</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <img src="../media/logo.png" alt="AC Milan Logo">
        <h1>AC Milan — Champions League</h1>
    </header>

    <!-- Navigatie -->
    <nav>
        <a href="../index.html">Home</a>
        <a href="spelers.html">Spelers</a>
        <a href="game.html">Quiz</a>
    </nav>

    <!-- Quiz -->
    <main>
        <div class="kaart">
            <h2>AC Milan Champions League Quiz</h2>

            <!-- Interactief element 1: invoerveld naam -->
            <label for="spelersnaam">Jouw naam:</label>
            <input type="text" id="spelersnaam" placeholder="Typ je naam...">

            <!-- Interactief element 2: dropdown aantal vragen -->
            <label for="aantalVragen">Aantal vragen:</label>
            <select id="aantalVragen">
                <option value="5">5 vragen</option>
                <option value="10">10 vragen</option>
                <option value="15">15 vragen</option>
            </select>

            <!-- Interactief element 3: checkbox hints -->
            <label>
                <input type="checkbox" id="hintsCheckbox"> Toon hints
            </label>

            <!-- Interactief element 4: startknop -->
            <button id="startKnop">Start Quiz</button>
        </div>

        <!-- Quiz zone -->
        <div id="quizZone" class="kaart">
            <p id="vraagNummer"></p>
            <p id="vraag"></p>
            <p id="hint"></p>
            <input type="text" id="antwoord" placeholder="Typ je antwoord...">
            <button id="bevestigKnop">Bevestig</button>
        </div>

        <!-- Interactief element 5: resetknop -->
        <div class="kaart">
            <button id="resetKnop">Reset Quiz</button>
            <p id="boodschap"></p>
            <p id="score">Score: 0</p>
        </div>

        <!-- Scorebord -->
        <div class="kaart">
            <h3>Scorebord</h3>
            <table id="scoreTabel">
                <tr>
                    <th>Rang</th>
                    <th>Naam</th>
                    <th>Score</th>
                    <th>Vragen</th>
                </tr>
            </table>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <table>
            <tr>
                <th>School</th>
                <th>Adres</th>
                <th>Stad</th>
            </tr>
            <tr>
                <td>Campus Het Spoor</td>
                <td>Schoolstraat 1</td>
                <td>9000 Gent</td>
            </tr>
        </table>
    </footer>

    <script src="../js/app.js"></script>

</body>
</html>
