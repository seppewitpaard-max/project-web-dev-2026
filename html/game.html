<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Spel</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Header met logo en titel -->
    <header>
        <img src="../media/logo.png" alt="Pokémon Logo">
        <h1>Pokémon Website</h1>
    </header>

    <!-- Navigatie -->
    <nav>
        <a href="../index.html">Home</a>
        <a href="game.html">Spel</a>
    </nav>

    <!-- Spel -->
    <main>
        <h2>Pokémon Raadspel</h2>

        <!-- Interactief element 1: invoerveld naam -->
        <label for="spelersnaam">Jouw naam:</label>
        <input type="text" id="spelersnaam" placeholder="Typ je naam...">

        <!-- Interactief element 2: dropdown moeilijkheid -->
        <label for="moeilijkheid">Moeilijkheidsgraad:</label>
        <select id="moeilijkheid">
            <option value="makkelijk">Makkelijk</option>
            <option value="normaal">Normaal</option>
            <option value="moeilijk">Moeilijk</option>
        </select>

        <!-- Interactief element 3: checkbox hints -->
        <label>
            <input type="checkbox" id="geluidsCheckbox"> Hints tonen
        </label>

        <!-- Interactief element 4: startknop -->
        <button id="startKnop">Start spel</button>

        <!-- Spel zone -->
        <div id="spelZone">
            <p id="hint"></p>
            <input type="text" id="antwoord" placeholder="Welke Pokémon is dit?">
            <button id="raadKnop">Raad!</button>
        </div>

        <!-- Interactief element 5: resetknop -->
        <button id="resetKnop">Reset spel</button>

        <!-- Output -->
        <p id="boodschap"></p>
        <p id="score">Score: 0</p>

    </main>

    <!-- Footer met schooladres -->
    <footer>
        <table>
            <tr>
                <th>School</th>
                <th>Adres</th>
                <th>Stad</th>
            </tr>
            <tr>
                <td>Jouw School</td>
                <td>Schoolstraat 1</td>
                <td>9000 Gent</td>
            </tr>
        </table>
    </footer>

    <!-- JavaScript koppelen -->
    <script src="../js/app.js"></script>

</body>
</html>
