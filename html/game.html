<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Milan Quiz</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <img src="../media/logo.jpg" alt="AC Milan Logo">
        <h1>AC Milan — Champions League</h1>
    </header>

    <nav>
        <a href="../index.html">Home</a>
        <a href="spelers.html">Spelers</a>
        <a href="game.html" class="actief">Quiz</a>
    </nav>

    <main>
        <div class="kaart">
            <h2>AC Milan Champions League Quiz</h2>

            <label for="spelersnaam">Jouw naam:</label>
            <input type="text" id="spelersnaam" placeholder="Typ je naam...">

            <label for="aantalVragen">Aantal vragen:</label>
            <select id="aantalVragen">
                <option value="5">5 vragen</option>
                <option value="10">10 vragen</option>
                <option value="15">15 vragen</option>
            </select>

            <label>
                <input type="checkbox" id="hintsCheckbox"> Toon hints
            </label>

            <button id="startKnop">Start Quiz</button>
        </div>

        <div id="quizZone" class="kaart">
            <p id="vraagNummer"></p>
            <p id="vraag"></p>
            <p id="hint"></p>
            <input type="text" id="antwoord" placeholder="Typ je antwoord...">
            <button id="bevestigKnop">Bevestig</button>
        </div>

        <div class="kaart">
            <button id="resetKnop" class="goud">Reset Quiz</button>
            <p id="boodschap"></p>
            <p id="score">Score: 0</p>
        </div>

        <div class="kaart">
            <h3>Scorebord</h3>
            <table id="scoreTabel">
                <tr>
                    <th>Rang</th><th>Naam</th><th>Score</th><th>Vragen</th>
                </tr>
            </table>
        </div>
    </main>

    <footer>
        <table>
            <tr><th>School</th><th>Adres</th><th>Stad</th></tr>
            <tr><td>Campus Het Spoor</td><td>Begonialaan 34</td><td>2400 Mol</td></tr>
        </table>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
